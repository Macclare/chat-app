- hosts: chat-app
  become: yes
  tasks:
    - name: Update all packages
      yum:
        name: '*'
        state: latest

    - name: Install Node.js & npm from Nodesource
      shell: |
        curl -sL https://rpm.nodesource.com/setup_18.x | bash -
        yum install -y nodejs

    - name: Install git, nginx
      yum:
        name:
          - git
          - nginx
        state: present

    - name: Start and enable NGINX
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Ensure /var/www/html directory exists
      file:
        path: /var/www/html
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Clone chat app repo into /var/www/html
      git:
        repo: "https://github.com/Macclare/chat-app.git"
        dest: /var/www/html/chat-app
        version: dev

    - name: Install Node.js dependencies
      shell: npm install
      args:
        chdir: /var/www/html/chat-app

    - name: Start or restart chat app with PM2
      shell: pm2 restart app.js --name chat-app || pm2 start app.js --name chat-app
      args:
        chdir: /var/www/html/chat-app

    - name: Deploy chat app NGINX config
      template:
        src: chat-app-nginx.conf
        dest: /etc/nginx/conf.d/chat-app.conf
        owner: root
        group: root
        mode: '0644'

    - name: Remove default NGINX site (optional)
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Reload NGINX to apply changes
      systemd:
        name: nginx
        state: reloaded
