
- hosts: chat-app
  become: yes
  tasks:
    - name: Update all packages
      yum:
        name: '*'
        state: latest

    - name: Install Node.js & npm from Nodesource
      shell: |
        curl -sL https://rpm.nodesource.com/setup_18.x | bash -
        yum install -y nodejs

    - name: Install git, nginx
      yum:
        name:
          - git
          - nginx
        state: present

    - name: Start and enable NGINX
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Ensure /var/www/html directory exists
      file:
        path: /var/www/html
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Clone chat app repo into /var/www/html
      git:
        repo: "https://github.com/Macclare/chat-app.git"
        dest: /var/www/html/chat-app
        version: dev

    - name: Install Node.js dependencies
      shell: npm install
      args:
        chdir: /var/www/html/chat-app

    - name: Start chat app with PM2
      shell: pm2 start server.js --name chat-app
      args:
        chdir: /var/www/html/chat-app
